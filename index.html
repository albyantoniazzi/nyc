    tailwind.config = {

  <style>
    /* Manhattan Custom Typeface (@font-face) */
    @font-face {
      font-family: 'Manhattan';
      src: url('./Manhattan.woff2') format('woff2'),
           url('./Manhattan.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    /* Vignelli Swiss Grid & Transit Rules */
    :root {
      --bg-primary: #FFFFFF;
      --text-primary: #000000;
      --border-heavy: #000000;
      --border-subtle: #E5E5E5;
      --card-bg: #F9F9F9;
    }

    html.dark {
      --bg-primary: #0A0A0A;
      --text-primary: #FFFFFF;
      --border-heavy: #FFFFFF;
      --border-subtle: #262626;
      --card-bg: #141414;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: "Manhattan", "Helvetica Neue", Helvetica, Inter, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Classic MTA Circular Bullet */
    .mta-bullet {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      font-weight: 700;
      line-height: 1;
      flex-shrink: 0;
      user-select: none;
    }

    /* Thick Vignelli Divider Rule */
    .vignelli-rule-heavy {
      border-top: 4px solid var(--border-heavy);
    }

    .tracking-vignelli {
      letter-spacing: -0.035em !important;
    }

    .vignelli-rule-medium {
      border-top: 2px solid var(--border-heavy);
    }

    .vignelli-rule-thin {
      border-top: 1px solid var(--border-subtle);
    }

    /* Transit Route Connector Styling */
    .route-track {
      position: relative;
    }

    /* Custom Scrollbar for Sidebar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #808183;
      border-radius: 3px;
    }

    /* Print Stylesheet: Force light mode, expand all days, hide interactive UI */
    @media print {
      body {
        background-color: #FFFFFF !important;
        color: #000000 !important;
      }
      header {
        position: static !important;
        border-bottom-color: #000000 !important;
      }
      #theme-toggle,
      #toggle-all-btn,
      .accordion-icon,
      footer {
        display: none !important;
      }
      .accordion-panel {
        display: block !important;
      }
      .day-section {
        break-inside: avoid;
      }
    }
  </style>
</head>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('itinerary-container');

      // Fallback image handler if Unsplash or custom URL fails
      window.handleImgError = function(img, dayNum) {
        img.onerror = null;
        img.src = `https://placehold.co/1200x675/111111/FFFFFF?text=NYC2026+%E2%80%A2+DAY+${String(dayNum).padStart(2, '0')}`;
      };

      // Session storage state for expanded accordions
      const STORAGE_KEY = 'nyc2026-open-days';
      let openDays = new Set();
      try {
        const saved = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || '[]');
        if (Array.isArray(saved)) openDays = new Set(saved);
      } catch (e) {
        openDays = new Set();
      }

      function saveOpenDays() {
        try {
          sessionStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(openDays)));
        } catch (e) {
          // Ignore storage quota errors
        }
      }

      // Format valid clock times (e.g., 15:55, 9:30, 3:15 PM) in bold
      function formatTimesBold(text) {
        return text.replace(/\b((?:[01]?\d|2[0-3]):[0-5]\d(?:\s?[AaPp][Mm])?)\b/g, '<strong class="font-bold">$1</strong>');
      }

      // 1. Render Main 13-Day Accordion Sections
      ITINERARY_DATA.forEach((item, index) => {
        const sectionId = `day-${item.day}`;
        const panelId = `panel-${item.day}`;
        const isLast = index === ITINERARY_DATA.length - 1;
        const isInitiallyOpen = openDays.has(item.day);

        // --- Main Section Card with Vignelli Map Route Visuals ---
        const section = document.createElement('article');
        section.id = sectionId;
        section.className = 'day-section scroll-mt-24 sm:scroll-mt-28 relative pl-12 sm:pl-16';

        // Vertical Transit Track Line colored to match the NEXT stop (centered in day circles)
        const nextItem = !isLast ? ITINERARY_DATA[index + 1] : item;
        const trackLineHtml = !isLast 
          ? `<div 
               class="absolute left-[17.5px] sm:left-[25px] top-10 -bottom-[23px] sm:-bottom-[31px] w-[5px] sm:w-[6px] rounded-full" 
               style="background-color: ${nextItem.color};"
             ></div>`
          : '';

        // Horizontal Transfer Station Dots (Stops) with fluid full-width connecting lines & wrapping on small screens
        const stopsHtml = item.stops.map((stop, sIdx) => {
          const isFirst = sIdx === 0;
          if (isFirst) {
            return `
              <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
                <span class="w-3 h-3 rounded-full border-[3px] border-[var(--border-heavy)] bg-[var(--bg-primary)] inline-block shrink-0"></span>
                <span class="text-xs sm:text-sm font-bold whitespace-nowrap">${stop}</span>
              </div>
            `;
          }
          return `
            <div class="flex-1 flex items-center min-w-fit">
              <div class="flex-1 min-w-[16px] h-[3px] bg-[var(--border-heavy)] opacity-30 mr-1.5 sm:mr-4 ${sIdx > 1 ? 'sm:ml-4' : 'ml-1.5 sm:ml-4'}"></div>
              <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
                <span class="w-3 h-3 rounded-full border-[3px] border-[var(--border-heavy)] bg-[var(--bg-primary)] inline-block shrink-0"></span>
                <span class="text-xs sm:text-sm font-bold whitespace-nowrap">${stop}</span>
              </div>
            </div>
          `;
        }).join('');

        section.innerHTML = `
          ${trackLineHtml}

          <!-- Day Number Bullet Positioned on the Transit Spine -->
          <div 
            class="mta-bullet w-10 h-10 sm:w-14 sm:h-14 text-lg sm:text-2xl absolute left-0 top-0 ring-4 ring-[var(--bg-primary)] shadow-sm z-10"
            style="background-color: ${item.color}; color: ${item.textColor};"
          >
            ${item.day}
          </div>

          <!-- Accordion Header Trigger (Number Bullet + Title + Day/Location Visible Initially) -->
          <button
            type="button"
            class="accordion-trigger w-full text-left border-t-4 border-[var(--border-heavy)] pt-3 pb-2 flex items-center justify-between gap-4 group cursor-pointer focus:outline-none"
            data-day="${item.day}"
            aria-expanded="${isInitiallyOpen ? 'true' : 'false'}"
            aria-controls="${panelId}"
          >
            <div>
              <h2 class="text-2xl sm:text-4xl font-black leading-tight tracking-[-0.035em] tracking-vignelli group-hover:underline decoration-4 underline-offset-4">
                ${item.borough.toLowerCase().replace(/\b\w/g, c => c.toUpperCase()).replace(/\bTo\b/g, 'to')}
              </h2>
              <div class="mt-1.5 flex flex-wrap items-center gap-1.5">
                <span class="text-xs sm:text-sm font-bold uppercase">${item.title.includes(' - ') ? item.title.split(' - ').reverse().join(' / ') : item.title}</span>
              </div>
            </div>
            <span class="accordion-icon shrink-0 w-8 h-8 sm:w-9 sm:h-9 rounded-full border-2 border-[var(--border-heavy)] flex items-center justify-center transition-transform duration-200 ${isInitiallyOpen ? 'rotate-180' : ''} group-hover:bg-black group-hover:text-white dark:group-hover:bg-white dark:group-hover:text-black">
              <svg class="w-5 h-5 sm:w-6 sm:h-6" viewBox="0 0 24 24" fill="currentColor">
                <path d="M9.8 2H14.2V14.2L18.8 9.6L21.7 12.5L12 22.2L2.3 12.5L5.2 9.6L9.8 14.2V2Z" />
              </svg>
            </span>
          </button>

          <!-- Collapsible Accordion Content -->
          <div id="${panelId}" class="accordion-panel ${isInitiallyOpen ? '' : 'hidden'} pt-4 pb-4">
            <!-- Subway Station Transfer Bar (Route Map Visual) -->
            <div class="mb-6 py-3 px-4 rounded-[6px] bg-[var(--card-bg)] border border-[var(--border-subtle)] flex flex-col sm:flex-row sm:items-center gap-y-2 w-full">
              <span class="text-[10px] font-black uppercase opacity-50 sm:mr-4 shrink-0">Stops</span>
              <div class="flex flex-wrap items-center justify-between gap-y-2.5 flex-1 w-full min-w-0">
                ${stopsHtml}
              </div>
            </div>

            <!-- Responsive Photo Frame -->
            <figure class="mb-5 overflow-hidden rounded-[6px] border border-[var(--border-heavy)] bg-neutral-900 aspect-[16/9]">
              <img 
                src="${item.imageUrl}" 
                alt="${item.title}"
                loading="lazy"
                onerror="handleImgError(this, ${item.day})"
                class="w-full h-full object-cover transition-transform duration-500 hover:scale-[1.02]"
              />
            </figure>

            <!-- Description / Notes -->
            <p class="text-sm sm:text-base leading-relaxed w-full">
              ${formatTimesBold(item.summary)}
            </p>
          </div>
          ${isLast ? '<div class="border-t-4 border-[var(--border-heavy)] mt-[19px] sm:mt-[27px]"></div>' : ''}
        `;

        container.appendChild(section);
      });

      // 2. Accordion Toggle & Expand/Collapse All Interactions
      const toggleAllBtn = document.getElementById('toggle-all-btn');
      const toggleAllIcon = document.getElementById('toggle-all-icon');
      const toggleAllLabel = document.getElementById('toggle-all-label');
      const triggers = Array.from(document.querySelectorAll('.accordion-trigger'));

      function setAccordionState(trigger, expand) {
        const dayNum = Number(trigger.getAttribute('data-day'));
        const panelId = trigger.getAttribute('aria-controls');
        const panel = document.getElementById(panelId);
        const icon = trigger.querySelector('.accordion-icon');

        trigger.setAttribute('aria-expanded', String(expand));
        if (expand) {
          panel.classList.remove('hidden');
          icon.classList.add('rotate-180');
          openDays.add(dayNum);
        } else {
          panel.classList.add('hidden');
          icon.classList.remove('rotate-180');
          openDays.delete(dayNum);
        }
      }

      function syncToggleAllLabel() {
        const allOpen = openDays.size === ITINERARY_DATA.length;
        const labelText = allOpen ? 'Collapse All' : 'Expand All';
        toggleAllLabel.textContent = labelText;
        toggleAllBtn.setAttribute('aria-label', labelText);
        if (allOpen) {
          toggleAllIcon.classList.add('rotate-180');
        } else {
          toggleAllIcon.classList.remove('rotate-180');
        }
      }

      syncToggleAllLabel();

      triggers.forEach(trigger => {
        trigger.addEventListener('click', () => {
          const isExpanded = trigger.getAttribute('aria-expanded') === 'true';
          setAccordionState(trigger, !isExpanded);
          saveOpenDays();
          syncToggleAllLabel();
        });
      });

      toggleAllBtn.addEventListener('click', () => {
        const shouldExpandAll = openDays.size < ITINERARY_DATA.length;
        triggers.forEach(trigger => setAccordionState(trigger, shouldExpandAll));
        saveOpenDays();
        syncToggleAllLabel();
      });

      // 3. Dark / Light Mode Toggle Logic
      const htmlEl = document.documentElement;
      const themeToggleBtn = document.getElementById('theme-toggle');
      const iconMoon = document.getElementById('icon-moon');
      const iconSun = document.getElementById('icon-sun');

      function applyTheme(isDark) {
        if (isDark) {
          htmlEl.classList.add('dark');
          iconMoon.classList.add('hidden');
          iconSun.classList.remove('hidden');
          themeToggleBtn.setAttribute('aria-label', 'Switch to Light Mode');
        } else {
          htmlEl.classList.remove('dark');
          iconMoon.classList.remove('hidden');
          iconSun.classList.add('hidden');
          themeToggleBtn.setAttribute('aria-label', 'Switch to Dark Mode');
        }
      }

      // Check saved preference or default to light (classic white Vignelli poster)
      const savedTheme = localStorage.getItem('nyc2026-theme');
      if (savedTheme === 'dark') {
        applyTheme(true);
      }

      themeToggleBtn.addEventListener('click', () => {
        const isCurrentlyDark = htmlEl.classList.contains('dark');
        const nextDark = !isCurrentlyDark;
        applyTheme(nextDark);
        localStorage.setItem('nyc2026-theme', nextDark ? 'dark' : 'light');
      });
    });
  </script>
</body>
</html>
